<!DOCTYPE html>
<html>
    <head>
        <title>Company Name</title>
        <meta name="viewport" content="width=device-width, initial-scale=0" >
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./css/index.css">
    </head>
    <body>
        <!-- header of the page, include logo and navigation bar -->
        <header>
            <div class="logo">
                <img src="./assets/images/logo.png" alt="logo">
                <div class="logo-overlay">Logo</div>
            </div>
            <div class="right-side">
                <nav class="navbar">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="#">News</a></li>
                        <li><a href="#">Events</a></li>
                        <li><a href="./pages/contact.html">Contact</a></li>
                        
                    </ul>
                </nav>
                <div class="search-bar">
                    <span id="searching-button" onclick="toggleVisible()" title="searching button">&#x1F50D;</span>
                    <div id="searching">
                        <label for="searching-bar">Search: </label>
                        <input type="text" id="searching-bar" />
                    </div>
                    
                </div>
            </div>
        </header>

        <!-- main of the page, includes news, events and contact method -->
        <main>

            <section class="event">
                <h2>Upcoming Events</h2>
                <div class="scroll-container">
                    <ul id="event-list"></ul>
                </div>
            </section>

            <section class="news">
                <h2>Latest News</h2>
                <hr>
                <div class="articles">
                    <article class="launches">
                        <h3>Event Lauch</h3>
                        <hr>
                        
                    </article>
                    <article class="updates">
                        <h3>System Update</h3>
                        <hr>
                        
                    </article>
                </div>
            </section>

            

            
        </main>

        <!-- copyright statement of your company -->
        <footer>
            <p>&copy; CompanyName </p>
        </footer>


        <script src="./scripts/index.js">

        </script>
    </body>
</html>
